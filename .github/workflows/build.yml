name: Build

on:
  push:
    branches: [ '**' ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish the mod zip as a GitHub release (tag v + the version in modinfo.json)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Game version to compile and test against. The mod itself works on 1.22.0 and later (see modinfo.json).
  VS_VERSION: "1.22.7"
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Check the texts and the JSON files
        shell: bash
        run: |
          set -eo pipefail
          mkdir -p results
          python3 tools/check_lang.py | tee results/lang-check.txt
          python3 tools/check_release.py | tee results/release-check.txt
          for f in modinfo.json assets/automaticclayformer/lang/en.json assets/automaticclayformer/config/vintagedoctor.json; do
            python3 -c "import json,sys; json.load(open(sys.argv[1], encoding='utf-8'))" "$f" || { echo "::error title=JSON::$f isn't valid JSON"; exit 1; }
          done

      - name: Cache Vintage Story server files
        id: cache-vs
        uses: actions/cache@v4
        with:
          path: ~/vsgame
          key: vs-server-${{ env.VS_VERSION }}-v1

      - name: Download Vintage Story server
        if: steps.cache-vs.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/vsgame
          url="https://cdn.vintagestory.at/gamefiles/stable/vs_server_linux-x64_${VS_VERSION}.tar.gz"
          if ! curl -fsSL --retry 3 -o /tmp/vs_server.tar.gz "$url"; then
            echo "Direct download failed, looking the file up in the version list"
            url=$(curl -fsSL https://api.vintagestory.at/stable.json | jq -r --arg v "$VS_VERSION" '.[$v].linuxserver.urls.cdn // empty')
            if [ -z "$url" ]; then echo "::error::No Linux server download found for Vintage Story $VS_VERSION"; exit 1; fi
            curl -fsSL --retry 3 -o /tmp/vs_server.tar.gz "$url"
          fi
          tar -xzf /tmp/vs_server.tar.gz -C ~/vsgame

      - name: Locate game files
        shell: bash
        run: |
          set -euo pipefail
          api=$(find ~/vsgame -maxdepth 3 -name VintagestoryAPI.dll | head -n 1)
          if [ -z "$api" ]; then echo "::error::VintagestoryAPI.dll not found in the server download"; exit 1; fi
          dir=$(dirname "$api")
          echo "VS_GAME_DIR=$dir" >> "$GITHUB_ENV"
          for f in VintagestoryAPI.dll Mods/VSSurvivalMod.dll Lib/0Harmony.dll Lib/protobuf-net.dll Lib/Newtonsoft.Json.dll assets/survival/recipes/clayforming; do
            if [ -e "$dir/$f" ]; then echo "found $f"; else echo "::warning::missing $f in the server download"; fi
          done

      # On failure, the end of the output is also shown as an annotation on the run, so it can be read without the log.
      - name: Build mod
        shell: bash
        run: |
          set -o pipefail
          if ! dotnet build AutomaticClayFormer.csproj -c Release -p:VintageStoryDir="$VS_GAME_DIR" 2>&1 | tee build.log; then
            cp build.log results/ 2>/dev/null
            msg=$(grep -E "error|warning CS" build.log | sort -u | tail -n 40 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Build failed::$msg"
            exit 1
          fi

      - name: Check the mod zip
        shell: bash
        run: |
          set -o pipefail
          python3 tools/check_release.py --zip 2>&1 | tee results/release-check.txt

      - name: Test forming planner against all vanilla clay recipes
        shell: bash
        run: |
          set -o pipefail
          if ! dotnet run --project tests/PlannerTests/PlannerTests.csproj -c Release -p:VintageStoryDir="$VS_GAME_DIR" -- "$VS_GAME_DIR" 2>&1 | tee test.log; then
            cp test.log results/ 2>/dev/null
            msg=$(grep -vE "^::" test.log | grep -vE " ok$" | tail -n 60 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Test output::$msg"
            exit 1
          fi

      # A real server with the mod and Vintage Doctor (from the Mod DB), driven from its console: Automatic Clay
      # Former's cards, page, item card, fix and JSON file have to show up in the doctor's answers. The server's
      # settings file starts out broken on purpose, so the doctor has a known problem of the mod's to explain.
      - name: Run a server with Vintage Doctor
        shell: bash
        run: |
          set +e
          cp build.log test.log results/ 2>/dev/null
          data="$RUNNER_TEMP/vsdata"
          mkdir -p "$data/Mods" "$data/ModConfig"
          cp release/*.zip "$data/Mods/"
          curl -fsSL "https://mods.vintagestory.at/api/v2/mods/install-information?ids=vintagedoctor&gv=${VS_VERSION}" -o doctor.json
          url=$(jq -r '.data.vintagedoctor.fileUrl // empty' doctor.json)
          name=$(jq -r '.data.vintagedoctor.fileName // empty' doctor.json)
          if [ -z "$url" ]; then echo "::error title=Server test::Vintage Doctor isn't on the Mod DB for $VS_VERSION"; cat doctor.json; exit 1; fi
          case "$url" in http*) ;; *) url="https://mods.vintagestory.at$url";; esac
          curl -fsSL --retry 3 -o "$data/Mods/$name" "$url" || { echo "::error title=Server test::couldn't download $url"; exit 1; }
          ls -la "$data/Mods" | tee results/mods.txt
          echo '{ "AllowAutomaticForming": true,' > "$data/ModConfig/AutomaticClayFormerServer.json"   # broken on purpose

          console="$RUNNER_TEMP/console"
          mkfifo "$console"
          (cd "$VS_GAME_DIR" && exec dotnet VintagestoryServer.dll --dataPath "$data" < "$console" > "$GITHUB_WORKSPACE/results/server-console.log" 2>&1) &
          pid=$!
          exec 3> "$console"
          log="$data/Logs/server-main.log"

          # The recipe check runs once the server is up; its line in the log says the server takes commands
          ready=0
          for i in $(seq 1 120); do
            if grep -qs "Checked .* clay forming recipes for Vintage Doctor" "$log" results/server-console.log; then ready=1; echo "ready after $((i*3))s"; break; fi
            if ! kill -0 $pid 2>/dev/null; then echo "server exited early"; break; fi
            sleep 3
          done

          # Something clay forming makes, from the recipe check's line (the longest recipe), for the item page
          made=$(grep -ohs "the longest, [^ ,]*," "$log" results/server-console.log | head -n 1 | sed 's/^the longest, //; s/,$//')
          echo "item for the item page: ${made:-none found}"
          version=$(jq -r .version modinfo.json)

          send() { echo ">>> $1" >> results/commands.txt; echo "$1" >&3; sleep "${2:-6}"; }
          if [ $ready = 1 ]; then
            send "/doctor" 12
            send "/doctor clayformer"
            send "/doctor mod automaticclayformer"
            send "/doctor item ${made:-game:bowl-blue-raw}"
            send "/doctor api"
            send "/clayformer server off"
            send "/doctor clayformer"
            send "/doctor fix bus:automaticclayformer:server-on"
            send "/doctor clayformer"
          fi
          send "/stop" 15
          exec 3>&-
          kill $pid 2>/dev/null; sleep 3; kill -9 $pid 2>/dev/null
          cp "$log" results/server-main.log 2>/dev/null
          cp "$data/ModConfig/AutomaticClayFormerServer.json" results/server-config-after.json 2>/dev/null
          cp "$data"/Logs/*crash* results/ 2>/dev/null

          # What the doctor's answers must contain
          out=results/server-console.log
          pass=0; fail=0
          check() {
            if grep -qF -- "$2" "$out"; then echo "PASS $1" >> results/server-test.txt; pass=$((pass+1))
            else echo "FAIL $1 (no \"$2\")" >> results/server-test.txt; fail=$((fail+1)); fi
          }
          : > results/server-test.txt
          [ $ready = 1 ] && echo "PASS the server ran the recipe check" >> results/server-test.txt || { echo "FAIL the server never ran the recipe check" >> results/server-test.txt; fail=$((fail+1)); }
          check "the check-up has the clay charging card" "Automatic forming takes clay like forming by hand"
          check "the check-up has the server switch card" "Players may form clay automatically on this server"
          check "the recipe check finished every recipe" "clay forming recipes can be finished by automatic forming"
          check "the doctor explains the mod's broken server settings file (JSON known problem)" "couldn't read the server's settings file"
          check "the mod's page is listed as a question" "Automatic Clay Former isn't shaping my clay"
          check "the page of its own is built on the server" "Automatic Clay Former on this server"
          check "the item page has the mod's card (${made:-no item found})" "Automatic Clay Former can make this"
          check "the doctor sees this version, demonic69 first" "Automatic Clay Former $version, by demonic69"
          check "the mod's file is named after its version" "file automaticclayformer_$version.zip"
          check "the switch turned off shows on the page" "Automatic forming is turned off on this server"
          check "the switched-off card offers the fix" "Allow automatic forming again"
          check "the fix over the event bus switches it back on" "Automatic clay forming is allowed again on this server"
          grep -q '"AllowAutomaticForming": true' results/server-config-after.json && echo "PASS the fix saved the server's settings" >> results/server-test.txt || { echo "FAIL the fix didn't save the server's settings" >> results/server-test.txt; fail=$((fail+1)); }
          grep -n "Automatic Clay Former\|automaticclayformer\|vintagedoctor" results/server-main.log > results/server-main-mod-lines.txt 2>/dev/null
          # Errors from the mod, except the one the broken settings file is there to cause
          if grep -E "\[(Server )?Error\].*(automaticclayformer|Automatic Clay Former)" results/server-main.log | grep -qv "Could not read ModConfig/AutomaticClayFormerServer.json"; then
            echo "FAIL the mod logged an error (see server-main-mod-lines.txt)" >> results/server-test.txt; fail=$((fail+1))
          fi
          echo "$pass passed, $fail failed" | tee -a results/server-test.txt
          cat results/server-test.txt
          if [ $fail -gt 0 ]; then
            echo "::error title=Server test::$(grep FAIL results/server-test.txt | head -n 8 | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          fi
          echo "::notice title=Server test::$pass checks passed with Vintage Doctor $name"

      # Job logs can't be read from a Claude session, so everything goes to the branch ci-results-<branch>.
      - name: Push the results to a branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          mkdir -p results
          cp build.log test.log results/ 2>/dev/null
          cp release/*.zip results/ 2>/dev/null
          branch="ci-results-$(echo "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" | tr -c 'A-Za-z0-9._-' '-' | sed 's/-*$//')"
          echo "commit=${GITHUB_SHA} ref=${GITHUB_REF_NAME} run=${GITHUB_RUN_ID} game=${VS_VERSION}" > results/README.txt
          cd results
          git init -q
          git checkout -q -b "$branch"
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -qm "Results of ${GITHUB_SHA} (run ${GITHUB_RUN_ID})"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$branch" && echo "pushed to $branch"

      - name: Upload mod zip
        uses: actions/upload-artifact@v4
        with:
          name: automaticclayformer
          path: release/*.zip
          if-no-files-found: error

      # Runs for a pushed v* tag, for "Run workflow" with Publish ticked (which makes the tag from modinfo.json), and
      # for a push to main: that publishes a new version (one with no release yet) once it has built and passed the
      # tests, and leaves an existing release alone.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release) || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(jq -r .version modinfo.json)
          TAG="v$VERSION"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "$GITHUB_REF_NAME" != "$TAG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match the version in modinfo.json ($VERSION)"; exit 1
          fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_TYPE" = "branch" ]; then
              echo "::notice title=Not published::$TAG is already released. Raise the version in modinfo.json to publish a new one."
              exit 0
            fi
            gh release upload "$TAG" release/*.zip --clobber
          else
            gh release create "$TAG" release/*.zip --target "$GITHUB_SHA" \
              --title "Automatic Clay Former $VERSION" --notes-file RELEASE_NOTES.md
          fi
          echo "::notice title=Released::$TAG with $(ls release/*.zip | xargs -n1 basename)"
